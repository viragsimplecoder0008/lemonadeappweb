
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemonade - The best selling lemonade</title>
    <meta name="description" content="Premium lemonade varieties for every taste. Shop our collection of handcrafted lemonades." />
    <meta name="author" content="Lemonade Luxury" />

    <meta property="og:title" content="Lemonade" />
    <meta property="og:description" content="Premium lemonade varieties for every taste. Shop our collection of handcrafted lemonades." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('lemonade-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
